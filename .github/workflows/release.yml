name: Multi-Architecture Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package (${{ matrix.target.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: win-x64
            description: 'Windows 64-bit (x64 / AMD64 / Intel)'
          - arch: win-arm64
            description: 'Windows ARM64 (Qualcomm Snapdragon / Surface Pro)'
          - arch: win-x86
            description: 'Windows 32-bit (x86 Legacy)'

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract Tag or Input Version
        id: get_version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish Remvora.App (${{ matrix.target.arch }})
        shell: pwsh
        run: |
          dotnet publish src/Remvora.App/Remvora.App.csproj `
            -c Release `
            -r ${{ matrix.target.arch }} `
            --self-contained `
            -p:PublishReadyToRun=false `
            -p:PublishTrimmed=false `
            -o ./staging/${{ matrix.target.arch }}

      - name: Publish Remvora.Elevation (${{ matrix.target.arch }})
        shell: pwsh
        run: |
          dotnet publish src/Remvora.Elevation/Remvora.Elevation.csproj `
            -c Release `
            -r ${{ matrix.target.arch }} `
            --self-contained `
            -o ./staging/${{ matrix.target.arch }}

      - name: Copy Setup Scripts
        shell: pwsh
        run: |
          Copy-Item scripts/install.ps1 ./staging/${{ matrix.target.arch }}/
          Copy-Item scripts/uninstall.ps1 ./staging/${{ matrix.target.arch }}/

      - name: Compress Release Archive
        shell: pwsh
        run: |
          $ver = "${{ steps.get_version.outputs.VERSION }}"
          $zipName = "Remvora-v$ver-${{ matrix.target.arch }}.zip"
          Compress-Archive -Path ./staging/${{ matrix.target.arch }}/* -DestinationPath ./$zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
        id: archive

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remvora-${{ matrix.target.arch }}
          path: ./${{ steps.archive.outputs.ZIP_NAME }}

  publish-github-release:
    name: Publish GitHub Release
    needs: build-and-release
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Collect Release Files & Generate SHA-256 Checksums
        id: checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./final-release -Force | Out-Null
          Get-ChildItem -Path ./release-artifacts -Recurse -Filter "*.zip" | ForEach-Object {
            Copy-Item $_.FullName -Destination ./final-release/
          }

          $checksums = @()
          Get-ChildItem -Path ./final-release -Filter "*.zip" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksums += "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Path ./final-release/checksums-sha256.txt -Encoding UTF8

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: Remvora ${{ github.ref_name || format('v{0}', github.event.inputs.version) }}
          files: |
            ./final-release/*.zip
            ./final-release/checksums-sha256.txt
          draft: false
          prerelease: false
          generate_release_notes: true
