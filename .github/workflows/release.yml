name: Multi-Architecture Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [win-x64, win-arm64, win-x86]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Remvora.App (${{ matrix.arch }})
        shell: pwsh
        run: |
          dotnet publish src/Remvora.App/Remvora.App.csproj `
            -c Release `
            -r ${{ matrix.arch }} `
            --self-contained `
            -p:PublishReadyToRun=false `
            -p:PublishTrimmed=false `
            -o ./staging/${{ matrix.arch }}

      - name: Publish Remvora.Elevation (${{ matrix.arch }})
        shell: pwsh
        run: |
          dotnet publish src/Remvora.Elevation/Remvora.Elevation.csproj `
            -c Release `
            -r ${{ matrix.arch }} `
            --self-contained `
            -o ./staging/${{ matrix.arch }}

      - name: Copy Setup Scripts
        shell: pwsh
        run: |
          Copy-Item scripts/install.ps1 ./staging/${{ matrix.arch }}/
          Copy-Item scripts/uninstall.ps1 ./staging/${{ matrix.arch }}/

      - name: Compress Release Archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -eq "master") {
            $tag = "${{ inputs.version }}"
            if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          }
          $zipName = "Remvora-$tag-${{ matrix.arch }}.zip"
          Compress-Archive -Path ./staging/${{ matrix.arch }}/* -DestinationPath ./$zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT
        id: archive

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Remvora-${{ matrix.arch }}
          path: ./${{ steps.archive.outputs.ZIP_NAME }}

  publish-github-release:
    name: Publish GitHub Release
    needs: build-and-release
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Collect Release Files & Generate SHA-256 Checksums
        id: checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path ./final-release -Force | Out-Null
          Get-ChildItem -Path ./release-artifacts -Recurse -Filter "*.zip" | ForEach-Object {
            Copy-Item $_.FullName -Destination ./final-release/
          }

          $checksums = @()
          Get-ChildItem -Path ./final-release -Filter "*.zip" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksums += "$hash  $($_.Name)"
          }
          $checksums | Set-Content -Path ./final-release/checksums-sha256.txt -Encoding UTF8

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Remvora ${{ github.ref_name }}
          files: |
            ./final-release/*.zip
            ./final-release/checksums-sha256.txt
          draft: false
          prerelease: false
          generate_release_notes: true
